name: Build Noctra Client JAR

on:
  push:
    branches: ["main"]
    paths:
      - "noctra-build/**"
      - ".github/workflows/noctra-client-jar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch tested Velo foundation
        run: |
          git clone https://github.com/velo345/velo-client.git upstream
          cd upstream
          git checkout 82549ea546affe905ef735852b2f163684ddad74

      - name: Apply Noctra changes
        run: python3 noctra-build/patch.py upstream

      - name: Build Minecraft 1.21.11 only
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :1.21.11:build --stacktrace --no-daemon

      - name: Collect JAR
        run: |
          mkdir -p dist
          JAR="$(find upstream/versions/1.21.11/build/libs -maxdepth 1 -type f -name 'noctra-client-*.jar' ! -name '*sources*' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" dist/NoctraClient-v2.0.0+1.21.11.jar
          sha256sum dist/NoctraClient-v2.0.0+1.21.11.jar > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NoctraClient-v2.0.0-1.21.11
          path: dist/*
          if-no-files-found: error
